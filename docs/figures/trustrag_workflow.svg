<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">TrustRAG evaluation workflow</title>
  <desc id="d">Corpora, chunking of the gold documents, ranking of every chunk by each model, construction of evidence references from the stored orderings, and measures and tests.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/>
    </marker>
  </defs>
  <rect width="1280" height="400" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="14" fill="none" stroke="#d9dee5"/>
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#191919">
    <text x="40" y="48" font-size="22" font-weight="700">Evaluation workflow</text>
    <text x="40" y="74" font-size="15" fill="#666666">Every reference is rescored from the same stored orderings: no model is run again.</text>

    <!-- box 1 -->
    <rect x="40" y="100" width="218" height="232" rx="10" fill="#f5f8fc" stroke="#c9d6e6"/>
    <text x="58" y="132" font-size="13" font-weight="700" fill="#257de0">1  CORPORA</text>
    <text x="58" y="160" font-size="14">QASPER v0.3, dev + test</text>
    <text x="58" y="180" font-size="14">2,197 questions, 684 papers</text>
    <text x="58" y="210" font-size="14">Natural Questions, validation</text>
    <text x="58" y="230" font-size="14">1,278 questions, 1,235 pages</text>
    <text x="58" y="262" font-size="13" fill="#666666">questions answerable from</text>
    <text x="58" y="280" font-size="13" fill="#666666">located evidence; several</text>
    <text x="58" y="298" font-size="13" fill="#666666">annotators per question</text>

    <!-- box 2 -->
    <rect x="288" y="100" width="218" height="232" rx="10" fill="#f5f8fc" stroke="#c9d6e6"/>
    <text x="306" y="132" font-size="13" font-weight="700" fill="#257de0">2  CHUNK GOLD DOCUMENTS</text>
    <text x="306" y="160" font-size="14">256 tokens (cl100k),</text>
    <text x="306" y="180" font-size="14">overlap 32</text>
    <text x="306" y="210" font-size="14">character offsets verified</text>
    <text x="306" y="230" font-size="14">for every chunk</text>
    <text x="306" y="262" font-size="13" fill="#666666">a chunk is gold when it</text>
    <text x="306" y="280" font-size="13" fill="#666666">overlaps a reference span</text>

    <!-- box 3 -->
    <rect x="536" y="100" width="218" height="232" rx="10" fill="#f5f8fc" stroke="#c9d6e6"/>
    <text x="554" y="132" font-size="13" font-weight="700" fill="#257de0">3  RANK EVERY CHUNK</text>
    <text x="554" y="160" font-size="14">BM25</text>
    <text x="554" y="180" font-size="14">bi-encoders (MiniLM,</text>
    <text x="554" y="200" font-size="14">Granite-30M, BGE-M3, ...)</text>
    <text x="554" y="220" font-size="14">ColBERT-small</text>
    <text x="554" y="240" font-size="14">cross-encoders (ms-marco,</text>
    <text x="554" y="260" font-size="14">Jina-turbo, bge-reranker)</text>
    <text x="554" y="292" font-size="13" fill="#666666">full best-first ordering</text>
    <text x="554" y="310" font-size="13" fill="#666666">stored per question and model</text>

    <!-- box 4 -->
    <rect x="784" y="100" width="218" height="232" rx="10" fill="#eef8f5" stroke="#b9e3d6"/>
    <text x="802" y="132" font-size="13" font-weight="700" fill="#00876c">4  BUILD REFERENCES</text>
    <text x="802" y="160" font-size="14">first annotator</text>
    <text x="802" y="180" font-size="14">union of annotators</text>
    <text x="802" y="200" font-size="14">official rule (NQ)</text>
    <text x="802" y="220" font-size="14">plurality, agreement</text>
    <text x="802" y="240" font-size="14">one annotator drawn at</text>
    <text x="802" y="260" font-size="14">random (1,000 draws)</text>
    <text x="802" y="292" font-size="13" fill="#666666">from every annotator's</text>
    <text x="802" y="310" font-size="13" fill="#666666">stored gold chunks</text>

    <!-- box 5 -->
    <rect x="1032" y="100" width="208" height="232" rx="10" fill="#f5f8fc" stroke="#c9d6e6"/>
    <text x="1050" y="132" font-size="13" font-weight="700" fill="#257de0">5  MEASURE AND TEST</text>
    <text x="1050" y="160" font-size="14">hit@k, MRR, exact</text>
    <text x="1050" y="180" font-size="14">chance level, κ₁</text>
    <text x="1050" y="208" font-size="14">cluster permutation tests,</text>
    <text x="1050" y="228" font-size="14">McNemar, Holm</text>
    <text x="1050" y="256" font-size="14">random-gold controls:</text>
    <text x="1050" y="276" font-size="14">uniform, position-matched</text>
    <text x="1050" y="304" font-size="13" fill="#666666">overlap-rule and</text>
    <text x="1050" y="322" font-size="13" fill="#666666">chunk-size sensitivity</text>
  </g>
  <g stroke="#8a94a3" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M260 216 H284"/><path d="M508 216 H532"/><path d="M756 216 H780"/><path d="M1004 216 H1028"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666">
    <text x="40" y="368">Independent checks: a re-implementation that shares no code with the analysis recomputes the reported values; BM25 orderings are recomputed exactly.</text>
  </g>
</svg>
