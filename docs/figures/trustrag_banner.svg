<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d">
  <title id="t">TrustRAG</title>
  <desc id="d">TrustRAG: evidence-level retrieval evaluation for RAG, and how the evidence reference shapes the results.</desc>
  <rect width="1280" height="300" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1279" height="299" rx="14" fill="none" stroke="#d9dee5"/>
  <rect x="0" y="0" width="10" height="300" rx="5" fill="#257de0"/>
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="64" y="118" font-size="64" font-weight="700" fill="#191919">TrustRAG</text>
    <text x="66" y="170" font-size="25" fill="#191919">Evidence-level retrieval evaluation for RAG:</text>
    <text x="66" y="204" font-size="25" fill="#191919">how the evidence reference shapes scores and model comparisons</text>
    <text x="66" y="252" font-size="17" fill="#666666">QASPER and Natural Questions · multi-annotator evidence · BM25, bi-encoders, ColBERT, cross-encoders</text>
  </g>
  <!-- motif: one document's chunks, ranked; evidence marked by two annotators -->
  <g transform="translate(905,40)">
    <text x="0" y="0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666">chunks of the gold document, best first</text>
    <g transform="translate(0,16)">
      <rect x="0"   y="0" width="300" height="22" rx="4" fill="#00b894"/>
      <rect x="0"  y="30" width="252" height="22" rx="4" fill="#257de0"/>
      <rect x="0"  y="60" width="214" height="22" rx="4" fill="#e3e7ec"/>
      <rect x="0"  y="90" width="186" height="22" rx="4" fill="#257de0"/>
      <rect x="0" y="120" width="150" height="22" rx="4" fill="#e3e7ec"/>
      <rect x="0" y="150" width="118" height="22" rx="4" fill="#e3e7ec"/>
      <rect x="0" y="180" width="86"  height="22" rx="4" fill="#e3e7ec"/>
    </g>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#191919">
      <rect x="0" y="232" width="12" height="12" rx="2" fill="#257de0"/><text x="18" y="243">first annotator</text>
      <rect x="128" y="232" width="12" height="12" rx="2" fill="#00b894"/><text x="146" y="243">another annotator</text>
    </g>
  </g>
</svg>
